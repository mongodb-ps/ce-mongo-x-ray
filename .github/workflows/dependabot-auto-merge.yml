name: Dependabot Auto-Merge

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        runs-on: ubuntu-latest
        # Keyed on the pull request author, not on the event actor: GitHub reports
        # the actor as whoever reopened or pushed last, but the update policy
        # only depends on who opened the pull request.
        if: github.event.pull_request.user.login == 'dependabot[bot]'

        steps:
            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@v3
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            # Patch and minor updates merge without review. Major updates merge
            # without review only for the CI actions and the build/lint/test
            # tooling, which cannot change the behaviour of a released package.
            # A major update of a runtime dependency always needs a human.
            - name: Decide whether this update can merge without review
              id: policy
              env:
                  UPDATE_TYPE: ${{ steps.metadata.outputs['update-type'] }}
                  DEPENDENCY_NAMES: ${{ steps.metadata.outputs['dependency-names'] }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  if [ "${UPDATE_TYPE}" = "version-update:semver-patch" ] || [ "${UPDATE_TYPE}" = "version-update:semver-minor" ]; then
                      echo "merge=true" >> "${GITHUB_OUTPUT}"
                  elif [[ "${HEAD_REF}" == dependabot/github_actions/* ]] || echo '["setuptools","wheel","ruff","pylint","pyright","pytest","pytest-cov","coverage","pluggy","iniconfig","tomli","types-Markdown"]' | grep -qF "\"${DEPENDENCY_NAMES}\""
                  then
                      echo "merge=true" >> "${GITHUB_OUTPUT}"
                  else
                      echo "merge=false" >> "${GITHUB_OUTPUT}"
                  fi

            # These branches have no required status checks, so `gh pr merge
            # --auto` would merge immediately. Poll the checks instead, and only
            # merge a green pull request; anything else stays open for a human.
            # This job's own check ("auto-merge") is excluded: it stays
            # in progress until the job ends, so waiting on it never finishes.
            - name: Wait for every check to pass
              if: steps.policy.outputs.merge == 'true'
              env:
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  for attempt in $(seq 1 60); do
                      response="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" 2>/dev/null || echo '{"check_runs":[]}')"
                      total="$(printf '%s' "${response}" | jq '[.check_runs[] | select(.name != "auto-merge")] | length' 2>/dev/null || echo 0)"
                      pending="$(printf '%s' "${response}" | jq '[.check_runs[] | select(.name != "auto-merge") | select(.status != "completed")] | length' 2>/dev/null || echo 0)"
                      failed="$(printf '%s' "${response}" | jq '[.check_runs[] | select(.name != "auto-merge") | select(.status == "completed") | select(.conclusion as $c | (["success", "neutral", "skipped"] | index($c)) == null)] | length' 2>/dev/null || echo 0)"
                      echo "attempt ${attempt}: checks=${total} pending=${pending} not-green=${failed}"
                      if [ "${total}" -eq 0 ] || [ "${pending}" -gt 0 ]; then
                          sleep 20
                          continue
                      fi
                      if [ "${failed}" -gt 0 ]; then
                          echo "::error::Checks are not green - leaving the pull request open for review."
                          exit 1
                      fi
                      echo "all checks are green"
                      exit 0
                  done
                  echo "::error::Timed out waiting for checks - leaving the pull request open for review."
                  exit 1

            - name: Merge the pull request
              if: steps.policy.outputs.merge == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  for attempt in 1 2 3; do
                      if gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --squash; then
                          echo "merged on attempt ${attempt}"
                          exit 0
                      fi
                      echo "attempt ${attempt} failed - usually a concurrent merge left this branch stale"
                      sleep 20
                  done
                  # Sibling Dependabot pull requests edit the same manifests, so a
                  # merged neighbour can leave this branch conflicted. Ask Dependabot
                  # to rebase: the resulting synchronize event reruns this workflow.
                  gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "@dependabot rebase"
                  echo "::notice::Requested a Dependabot rebase; the next run merges the pull request."

            - name: Comment on updates that need a human
              if: steps.policy.outputs.merge == 'false'
              run: |
                  gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "⚠️ This is a **major version update** of a runtime dependency. Please review carefully before merging."
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
