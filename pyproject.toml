[build-system]
requires = ["setuptools==84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-x-ray"
version = "1.5.3"
description = "MongoDB diagnostics toolkit with health checks and log analysis"
readme = "README.md"
requires-python = ">=3.10,<4"
license = { file = "LICENSE" }
authors = [{ name = "Yaoxing Zhang" }]
keywords = ["mongodb", "diagnostics", "healthcheck", "log-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "pymongo==4.17.0",
  "Jinja2==3.1.6",
  "Markdown==3.10.3",
  "types-Markdown==3.10.2.20260712",
  "MarkupSafe==3.0.3",
  "packaging==26.3",
  "Pygments==2.20.0",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "urllib3==2.7.0",
  "openai==3.0.0",
  "chromadb==1.5.9",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "h11==0.16.0",
  "certifi==2026.7.22",
  "idna==3.19",
  "sniffio==1.3.1",
  "anyio==4.14.2",
  "python-dateutil==2.9.0.post0",
  "types-python-dateutil==2.9.0.20260807",
  "pymongoftdc>=0.1.1",
  "python-dotenv==1.2.2",
  "WeasyPrint==69.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.3",
  "pylint==4.0.7",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pluggy==1.6.0",
  "iniconfig==2.3.0",
  "tomli==2.4.1",
  "pyinstaller==6.22.0",
  "pyinstaller-hooks-contrib>=2026.6",
  "macholib==1.16.4",
  "altgraph==0.17.5",
  "playwright==1.62.0",
]
[project.urls]
Homepage = "https://github.com/mongodb-ps/ce-mongo-x-ray"
Repository = "https://github.com/mongodb-ps/ce-mongo-x-ray"
Issues = "https://github.com/mongodb-ps/ce-mongo-x-ray/issues"

[tool.setuptools]
include-package-data = false

[project.scripts]
x-ray = "x_ray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["x_ray*"]
exclude = ["tests*", "output*", "misc*", "build*", "dist*"]

[tool.setuptools.package-data]
"x_ray" = [
  "config.json",
  "compatibility_matrix.json",
  "templates/**/full.html",
  "templates/**/script.js",
  "templates/**/style.css",
  "templates/css/shared.css",
  "templates/**/snippets/*[!w].js",
  "templates/js/*[!w].js",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Mirror the previous toolchain: pylint --errors-only + flake8 (E, F) + isort (I).
# E501 (line-too-long) was never enforced (pylint disabled C0301).
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pylint]
# Lint contract with ruff: `make lint` runs BOTH tools over src and tests and
# both must pass. ruff owns style (E/F/I, pycodestyle + pyflakes + isort) and
# pylint owns the W/E defects and import placement. The exception lists below
# are the shared policy: every family disabled here is intentionally off in
# both tools (ruff has no equivalent rule to turn on, and vice versa).
#
# - C0301: line length is owned by ruff's 120-column rule.
# - C0114/C0115/C0116: docstrings are not part of the gate (ruff's E/F/I do
#   not check them).
# - R0801: the shared parser fixtures in tests intentionally duplicate large
#   sample documents (ruff has no duplicate-code rule).
# - R0902/R0903/R0911/R0912/R0913/R0914/R0915/R0917/R1702: the too-many-* /
#   design-suggestion family (ruff's E/F/I do not check them).
max-line-length = 120
disable = [
  "C0301",          # line-too-long: ruff's 120-column rule owns this
  "C0114",          # missing-module-docstring: not part of the gate
  "C0115",          # missing-class-docstring: not part of the gate
  "C0116",          # missing-function-docstring: not part of the gate
  "R0801",          # duplicate-code: shared parser fixtures duplicate samples
  "R0902",          # too-many-instance-attributes: design suggestion
  "R0903",          # too-few-public-methods: design suggestion
  "R0911",          # too-many-returns: design suggestion
  "R0912",          # too-many-branches: design suggestion
  "R0913",          # too-many-arguments: design suggestion
  "R0914",          # too-many-locals: design suggestion
  "R0915",          # too-many-statements: design suggestion
  "R0917",          # too-many-positional-arguments: design suggestion
  "R1702",          # too-many-nested-blocks: design suggestion
]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers", "--color=yes", "-ra"]
markers = [
  'slow: marks tests as slow (deselect via -m "not slow")',
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]
minversion = "6.0"
console_output_style = "progress"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
